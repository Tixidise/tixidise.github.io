<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tixidise Accounts</title>
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html{
    scroll-behavior:smooth;
}

:root{
    --background-image:url('greenbackground.jpg');
    --background-blur:10px;
    --background-darkness:.10;
    --gfx-scroll-duration:85s;
}

body{
    background:#000;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    isolation:isolate;
}

body::before{
    content:'';
    position:fixed;
    inset:-25px;
    z-index:-2;
    background-image:var(--background-image);
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    filter:blur(var(--background-blur));
    pointer-events:none;
}

body::after{
    content:'';
    position:fixed;
    inset:0;
    z-index:-1;
    background:rgba(0,0,0,var(--background-darkness));
    pointer-events:none;
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    padding:16px 28px;
    background:rgba(15,15,15,.3);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(25px);
    -webkit-backdrop-filter:blur(25px);
}

.nav-brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.site-icon{
    width:30%;
    max-width:500px;
    height:auto;
    object-fit:contain;
    border:none;
    border-radius:0;
    display:block;
    --logo-outline-color:white;
    filter:
        drop-shadow(1px 0 0 var(--logo-outline-color))
        drop-shadow(-1px 0 0 var(--logo-outline-color))
        drop-shadow(0 1px 0 var(--logo-outline-color))
        drop-shadow(0 -1px 0 var(--logo-outline-color))
        drop-shadow(1px 1px 0 var(--logo-outline-color))
        drop-shadow(-1px -1px 0 var(--logo-outline-color))
        drop-shadow(1px -1px 0 var(--logo-outline-color))
        drop-shadow(-1px 1px 0 var(--logo-outline-color));
}

.github-text{
    font-family:'Inter',sans-serif;
    font-size:2rem;
    font-weight:700;
    color:white;
    white-space:nowrap;
    position:relative;
    right:4px;
    top:16px;
}

.nav-right{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:22px;
}

.discord-info{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    gap:4px;
    white-space:nowrap;
}

.discord-username{
    font-size:14px;
    font-weight:600;
    color:white;
}

.discord-id{
    font-size:14px;
    font-weight:600;
    color:white;
    user-select:all;
}

.socials{
    display:flex;
    align-items:center;
    gap:13px;
}

.social-link{
    width:30px;
    height:30px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform .2s,opacity .2s;
}

.social-link:hover{
    transform:translateY(-3px);
    opacity:.75;
}

.social-link img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

main{
    width:100%;
    padding-top:90px;
    position:relative;
    z-index:1;
}

.gfx-section{
    width:100%;
    padding-top:16px;
    padding-bottom:52px;
}

.gfx-heading{
    max-width:1700px;
    margin:0 auto;
    padding:12px 28px 20px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
}

.gfx-heading > div{
    min-width:0;
}

.gfx-heading h1{
    font-size:clamp(24px,3vw,40px);
    font-weight:700;
    letter-spacing:-1px;
    text-shadow:0 2px 12px rgba(0,0,0,.4);
}

.gfx-heading p{
    color:white;
    font-size:13px;
    margin-top:7px;
}

.gfx-label{
    font-size:11px;
    color:white;
    letter-spacing:2px;
    white-space:nowrap;
}

.account-count{
    flex-shrink:0;
    color:white;
    font-size:12px;
    padding:9px 13px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:999px;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
}

.gfx-view-toggle{
    font-family:'Inter',sans-serif;
    white-space:nowrap;
    cursor:pointer;
    transition:background .2s,border-color .2s;
}

.gfx-view-toggle:hover{
    background:rgba(255,255,255,.12);
    border-color:rgba(255,255,255,.3);
}

.gfx-window{
    width:100%;
    overflow:hidden;
    position:relative;
    padding:8px 0 18px;
    mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);
    -webkit-mask-image:linear-gradient(to right,transparent,black 5%,black 95%,transparent);
}

.gfx-track{
    display:flex;
    align-items:stretch;
    width:max-content;
    gap:20px;
    padding-right:20px;
    animation:gfx-scroll var(--gfx-scroll-duration) linear infinite;
    will-change:transform;
}

.gfx-window:hover .gfx-track:not(.is-grid){
    animation-play-state:paused;
}

.gfx-slide{
    width:clamp(300px,42vw,620px);
    height:clamp(190px,27vw,340px);
    flex:0 0 auto;
    border-radius:24px;
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.18);
    background:
        radial-gradient(ellipse at top left,rgba(255,255,255,.17),transparent 55%),
        linear-gradient(135deg,rgba(255,255,255,.10),rgba(0,0,0,.45));
    backdrop-filter:blur(20px);
    box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.gfx-slide img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.gfx-fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:17px;
    font-weight:600;
    letter-spacing:3px;
    text-shadow:0 2px 10px black;
}

.gfx-window.is-grid{
    overflow:visible;
    mask-image:none;
    -webkit-mask-image:none;
}

.gfx-track.is-grid{
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    width:100%;
    gap:20px;
    padding:8px 28px 18px;
    animation:none;
    transform:none;
    will-change:auto;
}

.gfx-track.is-grid .gfx-slide{
    width:100%;
    height:auto;
    aspect-ratio:16 / 9;
    min-width:0;
}

.gfx-track.is-grid .gfx-slide[aria-hidden="true"]{
    display:none;
}

@keyframes gfx-scroll{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-50%);
    }
}

.accounts-section{
    width:100%;
    max-width:1800px;
    margin:0 auto;
    padding:10px 28px 70px;
}

.section-heading{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:28px;
}

.section-heading h2{
    font-size:clamp(25px,3vw,36px);
    font-weight:700;
    letter-spacing:-.8px;
    text-shadow:0 2px 12px rgba(0,0,0,.4);
}

.section-heading p{
    color:white;
    font-size:14px;
    line-height:1.6;
    margin-top:8px;
}

.account-filters{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:24px;
}

.account-filter{
    appearance:none;
    font-family:'Inter',sans-serif;
    color:white;
    cursor:pointer;
    white-space:nowrap;
}

.account-filter.active{
    background:rgba(255,255,255,.15);
    border-color:rgba(255,255,255,.4);
}

.account-filter.active:hover{
    background:rgba(255,255,255,.2);
}

.accounts-grid{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:18px;
}

.account-card{
    min-width:0;
    overflow:hidden;
    padding:12px;
    display:flex;
    flex-direction:column;
    background:rgba(255,255,255,.055);
    border:1px solid rgba(255,255,255,.13);
    border-radius:23px;
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    transition:transform .3s,border-color .3s,box-shadow .3s;
    animation:card-appear .35s ease both;
}

.account-card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.3);
    box-shadow:0 10px 35px rgba(0,0,0,.2);
}

@keyframes card-appear{
    from{
        opacity:0;
        transform:translateY(12px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.account-avatar{
    display:block;
    width:100%;
    aspect-ratio:1.3 / 1;
    position:relative;
    overflow:hidden;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.12);
    background:
        radial-gradient(ellipse at top left,rgba(255,255,255,.15),transparent 60%),
        rgba(0,0,0,.25);
}

.account-avatar img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.avatar-fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    text-align:center;
    font-size:11px;
    color:white;
    letter-spacing:1px;
    text-transform:uppercase;
}

.account-info{
    padding:14px 2px 0;
    display:flex;
    flex-direction:column;
    flex:1;
    min-width:0;
}

.account-info h3{
    font-size:16px;
    line-height:1.4;
    font-weight:700;
    overflow-wrap:anywhere;
    text-shadow:0 1px 3px rgba(0,0,0,.65);
}

.account-description{
    font-size:12px;
    color:white;
    line-height:1.6;
    margin-top:6px;
    min-height:38px;
    overflow-wrap:anywhere;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.items-heading{
    font-family:'Inter',sans-serif;
    color:white;
    font-size:11px;
    font-weight:600;
    letter-spacing:0;
    margin:15px 0 8px;
    text-transform:none;
}

.item-thumbnails{
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:5px;
}

.item-slot{
    width:100%;
    aspect-ratio:1;
    min-width:0;
    position:relative;
    overflow:hidden;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(0,0,0,.27);
    transition:border-color .2s,transform .2s;
}

.item-slot:hover{
    border-color:rgba(255,255,255,.5);
    transform:translateY(-2px);
}

.item-slot img{
    position:absolute;
    inset:0;
    z-index:1;
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.item-fallback{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10px;
    color:white;
}

.account-profile-link{
    display:block;
    margin-top:15px;
    padding:10px 12px;
    background:white;
    color:#111;
    border-radius:999px;
    text-decoration:none;
    text-align:center;
    font-weight:600;
    font-size:12px;
    transition:opacity .2s,transform .2s;
}

.account-profile-link:hover{
    opacity:.8;
    transform:translateY(-1px);
}

.load-more-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    padding-top:40px;
}

.load-more-button{
    padding:14px 32px;
    background:rgba(255,255,255,.96);
    color:#101010;
    border:1px solid rgba(255,255,255,.5);
    border-radius:999px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:transform .2s,opacity .2s,box-shadow .2s;
}

.load-more-button:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,0,0,.18);
}

.load-more-button:disabled{
    opacity:.5;
    cursor:default;
    transform:none;
}

.load-status{
    font-size:12px;
    color:white;
    text-align:center;
}

.empty-message{
    padding:50px 20px;
    text-align:center;
    color:white;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.04);
    border-radius:22px;
    grid-column:1 / -1;
}

footer{
    text-align:center;
    padding:35px;
    color:white;
    position:relative;
    z-index:1;
    border-top:1px solid rgba(255,255,255,.08);
    background:rgba(0,0,0,.12);
}

@media(max-width:1450px){
    .accounts-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
    }
}

@media(max-width:1100px){
    .accounts-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
    }

    .accounts-section{
        padding-left:22px;
        padding-right:22px;
    }
}

@media(max-width:768px){
    nav{
        padding:12px 15px;
        gap:10px;
    }

    .site-icon{
        width:100px;
        max-width:100px;
    }

    .nav-brand{
        gap:8px;
    }

    .github-text{
        font-size:1.05rem;
        right:0;
        top:0;
    }

    .nav-right{
        gap:10px;
    }

    .discord-username{
        font-size:11px;
    }

    .discord-id{
        font-size:11px;
    }

    .socials{
        gap:8px;
    }

    .social-link{
        width:23px;
        height:23px;
    }

    main{
        padding-top:85px;
    }

    .gfx-section{
        padding-top:10px;
        padding-bottom:36px;
    }

    .gfx-heading{
        padding:12px 16px 16px;
        gap:10px;
    }

    .gfx-heading p{
        font-size:12px;
    }

    .gfx-label{
        display:none;
    }

    .gfx-slide{
        width:78vw;
        height:240px;
    }

    .gfx-track.is-grid{
        gap:12px;
        padding:8px 16px 18px;
    }

    .gfx-track.is-grid .gfx-slide{
        border-radius:15px;
    }

    .gfx-view-toggle{
        font-size:11px;
        padding:8px 10px;
    }

    .accounts-section{
        padding:8px 16px 50px;
    }

    .accounts-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .account-filters{
        gap:8px;
        margin-bottom:20px;
    }

    .account-filter{
        font-size:11px;
        padding:8px 10px;
    }

    .account-card{
        padding:9px;
        border-radius:19px;
    }

    .account-info{
        padding-top:11px;
    }

    .account-info h3{
        font-size:14px;
    }

    .account-description{
        font-size:11px;
    }

    .item-thumbnails{
        gap:4px;
    }

    .item-fallback{
        font-size:8px;
    }

    .account-profile-link{
        font-size:11px;
        padding:9px 7px;
    }
}

@media(max-width:480px){
    nav{
        padding:10px;
        gap:6px;
    }

    .site-icon{
        width:55px;
        max-width:55px;
    }

    .nav-brand{
        gap:4px;
    }

    .github-text{
        font-size:.75rem;
    }

    .nav-right{
        gap:7px;
    }

    .discord-username{
        font-size:9px;
    }

    .discord-id{
        font-size:9px;
    }

    .socials{
        gap:5px;
    }

    .social-link{
        width:18px;
        height:18px;
    }

    .gfx-heading h1{
        font-size:25px;
    }

    .gfx-heading p{
        font-size:11px;
    }

    .gfx-heading{
        gap:6px;
    }

    .gfx-view-toggle{
        font-size:10px;
        padding:7px 8px;
    }

    .gfx-slide{
        width:84vw;
        height:205px;
        border-radius:18px;
    }

    .gfx-track.is-grid{
        gap:8px;
        padding:8px 10px 18px;
    }

    .gfx-track.is-grid .gfx-slide{
        border-radius:10px;
    }

    .section-heading{
        align-items:flex-start;
        flex-direction:column;
        gap:12px;
    }

    .section-heading h2{
        font-size:26px;
    }

    .account-filters{
        gap:7px;
    }

    .account-filter{
        font-size:10px;
        padding:7px 9px;
    }

    .account-avatar{
        aspect-ratio:1 / 1;
    }

    .account-info h3{
        font-size:13px;
    }

    .account-description{
        min-height:35px;
        font-size:10px;
    }

    .items-heading{
        font-size:11px;
        letter-spacing:0;
    }

    .item-thumbnails{
        gap:3px;
    }

    .item-slot{
        border-radius:5px;
    }

    .item-fallback{
        font-size:7px;
    }

    .account-profile-link{
        font-size:10px;
    }
}

@media(prefers-reduced-motion:reduce){
    html{
        scroll-behavior:auto;
    }

    .gfx-track{
        animation:none;
    }

    .account-card{
        animation:none;
        transition:none;
    }

    .account-card:hover,
    .item-slot:hover,
    .load-more-button:hover{
        transform:none;
    }
}
</style>
</head>

<main>

</main>

const batchSize = 10;
let renderedCount = 0;
let activeFilter = "All";
let currentAccounts = [];

const gfxTrack = document.getElementById("gfxTrack");
const gfxWindow = document.querySelector(".gfx-window");
const gfxViewToggle = document.getElementById("gfxViewToggle");

function createGfxSlide(gfx, index, duplicate){
    const slide = document.createElement("div");
    slide.className = "gfx-slide";
    slide.setAttribute("aria-hidden", duplicate ? "true" : "false");

    const fallback = document.createElement("span");
    fallback.className = "gfx-fallback";
    fallback.textContent = gfx.alt || `GFX ${index + 1}`;
    slide.appendChild(fallback);

    const img = document.createElement("img");
    img.src = gfx.src;
    img.alt = duplicate ? "" : (gfx.alt || `GFX ${index + 1}`);
    img.loading = "eager";
    img.decoding = "async";
    img.onerror = function(){
        this.style.display = "none";
    };

    slide.appendChild(img);
    return slide;
}

function buildGfxCarousel(){
    gfxImages.forEach((gfx, index)=>{
        gfxTrack.appendChild(createGfxSlide(gfx,index,false));
    });

    gfxImages.forEach((gfx, index)=>{
        gfxTrack.appendChild(createGfxSlide(gfx,index,true));
    });
}

function toggleGfxView(){
    const showAll = gfxTrack.classList.toggle("is-grid");

    gfxWindow.classList.toggle("is-grid",showAll);
    gfxViewToggle.textContent = showAll ? "Back" : "View all GFX";
    gfxViewToggle.setAttribute("aria-pressed",String(showAll));
}

function getStackedItemCount(account){
    if(typeof account.itemCount === "number" && Number.isFinite(account.itemCount)){
        return account.itemCount;
    }

    const usernameMatch = String(account.username || "").match(/([\d,]+)\s*\+?\s*items?\b/i);

    if(usernameMatch){
        return Number(usernameMatch[1].replace(/,/g,"")) || 0;
    }

    const descriptionMatch = String(account.description || "").match(/(\d+)\s*pages?\b/i);

    if(descriptionMatch){
        return (Number(descriptionMatch[1]) || 0) * 30;
    }

    return 0;
}

function getFilteredAccounts(){
    if(activeFilter === "A-Z"){
        return [...accounts].sort((a,b)=>
            a.username.localeCompare(b.username,undefined,{sensitivity:"base"})
        );
    }

    if(activeFilter === "Z-A"){
        return [...accounts].sort((a,b)=>
            b.username.localeCompare(a.username,undefined,{sensitivity:"base"})
        );
    }

    if(activeFilter === "Under30"){
        return accounts.filter(account=>
            getStackedItemCount(account) < 30 &&
            getStackedItemCount(account) > 0
        );
    }

    if(activeFilter === "All"){
        return [...accounts];
    }

    if(activeFilter === "Stacked"){
        return accounts
            .filter(account=>
                Array.isArray(account.categories) &&
                account.categories.includes("Stacked")
            )
            .sort((a,b)=>getStackedItemCount(b)-getStackedItemCount(a));
    }

    if(activeFilter === "Stacked as fuck"){
        return accounts.filter(account=>
            Array.isArray(account.categories) &&
            account.categories.includes("Stacked as fuck")
        );
    }

    return accounts.filter(account=>
        Array.isArray(account.categories) &&
        account.categories.includes(activeFilter)
    );
}

function applyAccountFilter(filter){
    activeFilter = filter;
    currentAccounts = getFilteredAccounts();
    renderedCount = 0;
    accountsGrid.innerHTML = "";

    accountFilters.querySelectorAll(".account-filter").forEach(button=>{
        const isActive = button.dataset.filter === activeFilter;
        button.classList.toggle("active",isActive);
        button.setAttribute("aria-pressed",String(isActive));
    });

    renderNextBatch();
}

function createImageSlot(src, alt, fallbackText, className){
    const wrapper = document.createElement("div");
    wrapper.className = className;

    const fallback = document.createElement("span");
    fallback.className = className === "account-avatar" ? "avatar-fallback" : "item-fallback";
    fallback.textContent = className === "item-slot" ? "" : fallbackText;
    wrapper.appendChild(fallback);

    if(src){
        const img = document.createElement("img");
        img.src = src;
        img.alt = alt;
        img.loading = "lazy";
        img.decoding = "async";
        img.onerror = function(){
            this.style.display = "none";
        };
        wrapper.appendChild(img);
    }

    return wrapper;
}

function createAccountCard(account){
    const card = document.createElement("article");
    card.className = "account-card";

    const avatar = createImageSlot(
        account.thumbnail || `images/accounts/${account.folder}.png`,
        `${account.username} account thumbnail`,
        "",
        "account-avatar"
    );

    if(account.profileUrl && account.profileUrl.trim()){
        const avatarLink = document.createElement("a");
        avatarLink.className = "account-avatar";
        avatarLink.href = account.profileUrl;
        avatarLink.target = "_blank";
        avatarLink.rel = "noopener noreferrer";
        avatarLink.setAttribute("aria-label",`View ${account.username}`);

        while(avatar.firstChild){
            avatarLink.appendChild(avatar.firstChild);
        }

        card.appendChild(avatarLink);
    }else{
        card.appendChild(avatar);
    }

    const info = document.createElement("div");
    info.className = "account-info";

    const title = document.createElement("h3");
    title.textContent = account.username;
    info.appendChild(title);

    const description = document.createElement("p");
    description.className = "account-description";
    description.textContent = account.description || "";
    info.appendChild(description);

    const hasNoNotables = Array.isArray(account.categories) &&
        account.categories.some(category =>
            category === "Usernames" || category === "Aged Account"
        );

    const itemsHeading = document.createElement("div");
    itemsHeading.className = "items-heading";
    itemsHeading.textContent = "Notables";

    const itemsRow = document.createElement("div");
    itemsRow.className = "item-thumbnails";

    if(hasNoNotables){
        itemsHeading.style.visibility = "hidden";
        itemsHeading.setAttribute("aria-hidden","true");

        itemsRow.style.visibility = "hidden";
        itemsRow.setAttribute("aria-hidden","true");

        for(let i = 0; i < 5; i++){
            const item = document.createElement("div");
            item.className = "item-slot";
            itemsRow.appendChild(item);
        }
    }else{
        for(let i = 0; i < 5; i++){
            const itemData = account.items && account.items[i]
                ? account.items[i]
                : null;

            const itemName = typeof itemData === "object" && itemData !== null
                ? itemData.name
                : itemData || `Item ${i + 1}`;

            const itemImage = typeof itemData === "object" && itemData !== null
                ? itemData.image
                : `images/accounts/${account.folder}-item-${i + 1}.png`;

            const item = createImageSlot(
                itemImage,
                itemName,
                String(i + 0),
                "item-slot"
            );

            item.title = itemName;
            itemsRow.appendChild(item);
        }
    }

    info.appendChild(itemsHeading);
    info.appendChild(itemsRow);

    if(account.profileUrl && account.profileUrl.trim()){
        const profileLink = document.createElement("a");
        profileLink.className = "account-profile-link";
        profileLink.href = account.profileUrl;
        profileLink.target = "_blank";
        profileLink.rel = "noopener noreferrer";
        profileLink.textContent = "View account";
        info.appendChild(profileLink);
    }

    card.appendChild(info);
    return card;
}

function updateGalleryStatus(){
    accountCount.textContent = `${renderedCount} of ${currentAccounts.length} accounts`;

    loadStatus.textContent = renderedCount < currentAccounts.length
        ? `Showing ${renderedCount} of ${currentAccounts.length} accounts.`
        : "";

    loadMoreButton.hidden = renderedCount >= currentAccounts.length;
}

function renderNextBatch(){
    if(currentAccounts.length === 0){
        const emptyMessage = document.createElement("div");
        emptyMessage.className = "empty-message";
        emptyMessage.textContent = "No accounts in this section yet.";
        accountsGrid.appendChild(emptyMessage);
        updateGalleryStatus();
        return;
    }

    const nextAccounts = currentAccounts.slice(
        renderedCount,
        renderedCount + batchSize
    );

    if(nextAccounts.length === 0){
        updateGalleryStatus();
        return;
    }

    const fragment = document.createDocumentFragment();

    nextAccounts.forEach(account=>{
        fragment.appendChild(createAccountCard(account));
    });

    accountsGrid.appendChild(fragment);
    renderedCount += nextAccounts.length;

    updateGalleryStatus();
}

buildGfxCarousel();
applyAccountFilter("All");

gfxViewToggle.addEventListener("click",toggleGfxView);

accountFilters.querySelectorAll(".account-filter").forEach(button=>{
    button.addEventListener("click",()=>{
        applyAccountFilter(button.dataset.filter);
    });
});

loadMoreButton.addEventListener("click",()=>{
    renderNextBatch();
});
